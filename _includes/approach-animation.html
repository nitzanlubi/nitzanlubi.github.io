<div id="aa-node1-tip" class="aa-tip" role="tooltip" hidden>Brain activity is measured continuously with fMRI, EEG or MEG while the participant performs a cognitive task or applies mental strategies to influence the feedback.</div>
<div id="aa-node2-tip" class="aa-tip" role="tooltip" hidden>Univariate or multivariate analyses translate each new segment of brain data into an estimate of the participant’s current internal state, such as where attention is directed.</div>

<style>

<script>
(function () {
  var fig = document.currentScript.previousElementSibling.previousElementSibling;
  if (!fig || !fig.classList.contains('approach-anim')) fig = document.querySelector('.approach-anim');
  var $ = function (id) { return fig.querySelector('#' + id); };
  var brain = $('aa-brain'), rigidFills = fig.querySelectorAll('.aa-rigid'), adversity = $('aa-adversity'),
      correct = $('aa-correct'), correctLine = $('aa-correct-line'), loop = $('aa-loop'),
      pulse = $('aa-pulse'), gauge = $('aa-gauge'), trace = $('aa-trace'),
      nodes = [$('aa-node1'), $('aa-node2'), $('aa-node3')],
      arcs = [$('aa-arc1'), $('aa-arc2'), $('aa-arc3')],
      replay = fig.querySelector('.aa-replay');

  var CENTER = 480, RIGID = 755, Y = 123, SCALE = 1;
  var ease = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
  var seg = function (t, a, b) { return clamp((t - a) / (b - a)); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var arcLens = arcs.map(function (a) { return a.getTotalLength(); });
  var DURATION = 17.6;
  var T0 = 7.6;                       // loop starts cycling: one full round per second
  var WIN = 10, SPS = 5;              // plot shows the whole 10-second session, 5 samples per second
  var PX0 = -30, SECW = 62 / WIN;     // plot x-range inside the decoding screen
  var outAt = function (t) { return ease(seg(t, 2.6, 5.0)); };
  // Return to adaptive: one small step per second, each step taken as the pulse delivers feedback
  var TB = 8.6, STEPS = 8;
  // Learning curve: slow start, steeper middle, then levels off (normalised logistic)
  var logistic = function (x) { return 1 / (1 + Math.exp(-9 * (x - 0.5))); };
  var sCurve = function (x) { return (logistic(x) - logistic(0)) / (logistic(1) - logistic(0)); };
  var backAt = function (t) {
    var e = t - TB; if (e <= 0) return 0;
    var k = Math.floor(e), f = ease(seg(e - k, 0.6, 1.0));
    return sCurve(clamp((k + f) / STEPS));
  };
  var rnd = function (i) { var v = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return v - Math.floor(v); };
  function sample(sec, j) {
    // decoded 'adaptive state' level for this second (low while rigid, high once back to adaptive) + noise
    var tk = T0 + sec + (j + 0.5) / SPS, rig = clamp(outAt(tk) - backAt(tk));
    var i = sec * SPS + j, level = 0.14 + 0.72 * (1 - rig);
    var v = level + 0.14 * (rnd(i) - 0.5) + 0.03 * Math.sin(i * 1.7);
    return 8 - 30 * Math.max(0.03, Math.min(0.97, v));
  }
  function drawTrace(t) {
    var e = t - T0;
    if (e < 0) { trace.setAttribute('points', ''); return; }
    var k = Math.floor(e), cyc = e - k;
    var f = seg(cyc, 1 / 3, 2 / 3);          // the newest second is written as the pulse leaves the decoder
    var first = Math.max(0, k - (WIN - 1)), pts = [];
    for (var sec = first; sec <= k; sec++) {
      var n = sec < k ? SPS : Math.round(SPS * f);
      for (var j = 0; j < n; j++) {
        var x = PX0 + (sec - first) * SECW + (j + 0.5) * (SECW / SPS);
        pts.push(x.toFixed(1) + ',' + sample(sec, j).toFixed(1));
      }
    }
    trace.setAttribute('points', pts.join(' '));
  }

  function render(t) {
    // Brain position: drift right (2.6-5.0s), back to centre (9.6-12.4s)
    var out = outAt(t), back = backAt(t);
    var x = lerp(CENTER, RIGID, out - back);
    var breathe = SCALE * (1 + 0.025 * Math.sin(t * 2.4));
    var jitter = (out > 0.98 && back < 0.02) ? Math.sin(t * 40) * 0.6 : 0;
    brain.setAttribute('transform', 'translate(' + (x + jitter) + ' ' + Y + ') scale(' + breathe + ')');
    for (var r = 0; r < rigidFills.length; r++) rigidFills[r].setAttribute('opacity', (out - back).toFixed(3));

    adversity.setAttribute('opacity', (seg(t, 2.3, 2.9) - seg(t, 8.0, 8.6)).toFixed(3));

    // Loop builds up (5.4-8.4s)
    loop.setAttribute('opacity', seg(t, 5.4, 6.0).toFixed(3));
    nodes.forEach(function (n, i) {
      var p = ease(seg(t, 5.6 + i * 0.5, 6.2 + i * 0.5));
      n.style.opacity = p;
      n.style.transformBox = 'fill-box';
    });
    arcs.forEach(function (a, i) {
      var p = seg(t, 6.0 + i * 0.5, 6.6 + i * 0.5);
      a.style.strokeDasharray = arcLens[i];
      a.style.strokeDashoffset = arcLens[i] * (1 - p);
      if (p > 0.95) a.setAttribute('marker-end', 'url(#aa-head)'); else a.removeAttribute('marker-end');
    });

    // Signal pulse circulating around the loop once it is built
    if (t > T0) {
      var cyc = (t - T0) % 1, which = Math.min(2, Math.floor(cyc * 3)), local = cyc * 3 - which;
      var pt = arcs[which].getPointAtLength(arcLens[which] * local);
      pulse.setAttribute('cx', pt.x); pulse.setAttribute('cy', pt.y);
      pulse.setAttribute('opacity', 0.9);
    } else pulse.setAttribute('opacity', 0);

    drawTrace(t);

    // Feedback gauge rises as the brain is guided back
    var g = 6 + 16 * back + 2 * Math.sin(t * 3) * (t > 7.6 ? 1 : 0);
    gauge.setAttribute('height', Math.max(0, g * seg(t, 6.6, 7.2)).toFixed(2));
    gauge.setAttribute('y', (8.5 - Math.max(0, g * seg(t, 6.6, 7.2))).toFixed(2));
    // Gauge colour follows the brain's position on the scale: bluish grey (rigid) -> green (adaptive)
    var rig = clamp(out - back), G = [47, 158, 85], B = [111, 127, 152];
    gauge.setAttribute('fill', 'rgb(' + G.map(function (c, k) { return Math.round(lerp(c, B[k], rig)); }).join(',') + ')');

    // Corrective arrow draws in as the return begins
    var c = ease(seg(t, 8.2, 9.0));
    correct.setAttribute('opacity', (c - seg(t, 12.6, 13.2) * 0.0).toFixed(3));
    correctLine.setAttribute('x2', lerp(760, 560, c).toFixed(1));

  }

  var start = null, running = false;
  function frame(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;
    if (t >= DURATION) { render(DURATION); running = false; replay.classList.add('aa-show'); return; }
    render(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (running) return;
    running = true; start = null; replay.classList.remove('aa-show');
    requestAnimationFrame(frame);
  }
  replay.addEventListener('click', play);

  // ---- Hover / tap explanations for the neurofeedback components ----
  (function () {
    var open = null;
    // Put the card where it covers as little of the drawing as possible, as close to the component as it can.
    function place(node, tip) {
      var f = fig.getBoundingClientRect();
      tip.style.left = '0px'; tip.style.top = '0px';
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var rel = function (r) { return { l: r.left - f.left, t: r.top - f.top, r: r.right - f.left, b: r.bottom - f.top }; };
      var self = rel(node.querySelector('.aa-node-bg').getBoundingClientRect());
      var obs = [{ box: self, wt: 1000 }];
      fig.querySelectorAll('svg text, .aa-replay').forEach(function (el) {
        if (parseFloat(getComputedStyle(el).opacity) === 0) return;
        var g = el.closest('g[opacity]'); if (g && parseFloat(g.getAttribute('opacity')) < 0.05) return;
        obs.push({ box: rel(el.getBoundingClientRect()), wt: 3 });
      });
      nodes.forEach(function (n) { if (n !== node) obs.push({ box: rel(n.querySelector('.aa-node-bg').getBoundingClientRect()), wt: 6 }); });
      ['aa-brain', 'aa-correct'].forEach(function (id) { var el = $(id); if (el && parseFloat(el.getAttribute('opacity') || '1') > 0.05) obs.push({ box: rel(el.getBoundingClientRect()), wt: 2 }); });
      var bar = fig.querySelector('.aa-spectrum rect'); if (bar) obs.push({ box: rel(bar.getBoundingClientRect()), wt: 2 });
      var ov = function (a, b) { return Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t)); };
      var best = null, step = Math.max(4, Math.round(f.width / 120));
      var room = parseFloat(getComputedStyle(fig).marginBottom) || 0;     // empty margin below the figure
      var maxY = Math.max(0, f.height - h);
      for (var y = 0; y <= maxY + h * 0.6; y += step) {
        for (var x = 0; x <= f.width - w; x += step) {
          var c = { l: x, t: y, r: x + w, b: y + h }, score = 0;
          for (var i = 0; i < obs.length; i++) score += obs[i].wt * ov(c, obs[i].box);
          score += 3 * Math.max(0, c.b - f.height - room) * w;           // spilling onto the page text below counts as covering text
          var dx = Math.max(self.l - c.r, c.l - self.r, 0), dy = Math.max(self.t - c.b, c.t - self.b, 0);
          score += 140 * Math.sqrt(dx * dx + dy * dy);                    // stay near the component
          if (!best || score < best.s) best = { s: score, x: x, y: y };
        }
      }
      tip.style.left = best.x + 'px'; tip.style.top = best.y + 'px';
    }
    function show(node) {
      if (parseFloat(node.style.opacity || '0') < 0.5) return;   // only once the loop is visible
      if (open && open !== node) hide(open);
      var tip = fig.querySelector('#' + node.id + '-tip');
      tip.removeAttribute('hidden'); place(node, tip); tip.classList.add('aa-show');
      node.classList.add('aa-active'); open = node;
    }
    function hide(node) {
      var tip = fig.querySelector('#' + node.id + '-tip');
      tip.classList.remove('aa-show'); tip.setAttribute('hidden', '');
      node.classList.remove('aa-active'); if (open === node) open = null;
    }
    nodes.forEach(function (node) {
      node.addEventListener('mouseenter', function () { show(node); });
      node.addEventListener('mouseleave', function () { hide(node); });
      node.addEventListener('focus', function () { show(node); });
      node.addEventListener('blur', function () { hide(node); });
      node.addEventListener('click', function (e) { e.stopPropagation(); if (open === node) hide(node); else show(node); });
      node.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hide(node); node.blur(); } });
    });
    document.addEventListener('click', function () { if (open) hide(open); });
    window.addEventListener('resize', function () { if (open) place(open, fig.querySelector('#' + open.id + '-tip')); });
  })();

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(DURATION); replay.classList.add('aa-show'); return; }
  render(0);
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { play(); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(fig);
  } else play();
})();
</script>
